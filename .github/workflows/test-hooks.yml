name: Test All Hooks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test-go-hooks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hooks/debug-bundle
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test debug-bundle
        run: |
          go test ./...
      - name: Test security-scan-gate
        run: |
          cd ../security-scan-gate
          go test ./...

  test-ci-trigger-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hooks/ci-trigger-gate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hooks/ci-trigger-gate/go.mod
          cache-dependency-path: hooks/ci-trigger-gate/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  test-python-hooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hook: [maintenance-gate, slack-notifier, teams-notifier, webhook-relay]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ${{ matrix.hook }}
        run: |
          cd hooks/${{ matrix.hook }}
          python3 -m unittest discover .
