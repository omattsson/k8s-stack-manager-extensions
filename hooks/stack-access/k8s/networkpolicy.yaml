# Lets only the callers of stack-access reach it:
#   - Traefik (forwardAuth /auth),
#   - the k8s-stack-manager backend (the actions),
#   - the other stack-access pods (forward of write actions to the leader),
#   - Prometheus (/metrics).
# Change the namespace names to match your cluster. A Traefik or Prometheus
# pod with hostNetwork does not match a namespaceSelector: allow its node
# addresses with an ipBlock instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stack-access
  namespace: extensions
spec:
  podSelector:
    matchLabels:
      app: stack-access
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k8s-stack-manager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app: stack-access
      ports:
        - protocol: TCP
          port: 8080
