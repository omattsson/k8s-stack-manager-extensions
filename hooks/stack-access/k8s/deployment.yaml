# stack-access: basic auth in front of each stack.
# Apply admission-policy.yaml first (required), then this file,
# networkpolicy.yaml and traefik-middleware.yaml.
# Set the HMAC secret first (the same value as STACK_ACCESS_SECRET in the
# k8s-stack-manager backend):
#   kubectl -n extensions create secret generic stack-access-secret \
#     --from-literal=STACK_ACCESS_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Namespace
metadata:
  name: extensions
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stack-access
  namespace: extensions
---
# Read the stack namespaces; read, create and change only the access Secret.
# "create" cannot be limited to one name: admission-policy.yaml does that, so
# that policy is required. For tighter rights, give the write rules through a
# RoleBinding in each stack namespace and keep only the read rules here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stack-access
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["stack-basic-auth"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stack-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stack-access
subjects:
  - kind: ServiceAccount
    name: stack-access
    namespace: extensions
---
# The Lease of the leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stack-access-leader
  namespace: extensions
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    # Change this name together with LEASE_NAME.
    resourceNames: ["stack-access"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stack-access-leader
  namespace: extensions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stack-access-leader
subjects:
  - kind: ServiceAccount
    name: stack-access
    namespace: extensions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stack-access
  namespace: extensions
  labels:
    app: stack-access
spec:
  # Every replica answers the auth checks. One replica (the Lease holder)
  # does all writes. Keep at least 2: the auth check is in front of every
  # stack request.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: stack-access
  template:
    metadata:
      labels:
        app: stack-access
    spec:
      serviceAccountName: stack-access
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Longer than SHUTDOWN_DELAY (5 s), the HTTP shutdown (15 s) and the
      # release of the Lease (up to RENEW_DEADLINE, 10 s).
      terminationGracePeriodSeconds: 40
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: stack-access
      containers:
        - name: stack-access
          image: ghcr.io/omattsson/k8s-stack-manager-extensions/stack-access:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STACK_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: stack-access-secret
                  key: STACK_ACCESS_SECRET
            # Optional user:password that passes on every stack (CI).
            - name: SHARED_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: stack-access-secret
                  key: SHARED_CREDENTIALS
                  optional: true
            # Requests from these ranges pass without a password (for
            # example the office and the VPN). Empty: nobody passes without one.
            - name: BYPASS_CIDRS
              value: ""
            # The URL that the "show" action returns.
            - name: URL_TEMPLATE
              value: "https://{instance}.stacks.example.com"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stack-access
  namespace: extensions
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stack-access
---
apiVersion: v1
kind: Service
metadata:
  name: stack-access
  namespace: extensions
spec:
  selector:
    app: stack-access
  ports:
    - name: http
      port: 8080
      targetPort: http
