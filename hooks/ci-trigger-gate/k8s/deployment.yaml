# Example deployment with workload identity on a cluster without the Azure
# workload identity webhook. The pod gets a projected ServiceAccount token
# and the AZURE_* variables directly. No registry or Azure DevOps secret is
# needed. See README.md for the federated credential setup.
apiVersion: v1
kind: Namespace
metadata:
  name: extensions
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-trigger-gate
  namespace: extensions
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-trigger-gate-secret
  namespace: extensions
type: Opaque
stringData:
  CI_TRIGGER_WEBHOOK_SECRET: "REPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-trigger-gate-config
  namespace: extensions
data:
  REGISTRY_URL: "REPLACE_ME.azurecr.io"
  ADO_ORG: "REPLACE_ME"
  ADO_PROJECT: "REPLACE_ME"
  IMAGE_REPO_PREFIX: "dev/"
  CHART_EXTRA_IMAGES: ""
  FALLBACK_TAG: "latest-dev"
  DEFAULT_BRANCHES: "main,master"
  PIPELINE_SOURCE_BRANCH: "refs/heads/main"
  POLL_INTERVAL_SECONDS: "15"
  BUILD_TIMEOUT_MINUTES: "25"
  CACHE_TTL_MINUTES: "5"
  # Client ID of the managed identity or app registration with the
  # federated credential for system:serviceaccount:extensions:ci-trigger-gate.
  AZURE_CLIENT_ID: "REPLACE_ME"
  AZURE_TENANT_ID: "REPLACE_ME"
  AZURE_FEDERATED_TOKEN_FILE: "/var/run/secrets/azure/tokens/azure-identity-token"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-trigger-gate
  namespace: extensions
  labels:
    app: ci-trigger-gate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-trigger-gate
  template:
    metadata:
      labels:
        app: ci-trigger-gate
    spec:
      serviceAccountName: ci-trigger-gate
      automountServiceAccountToken: false
      containers:
        - name: ci-trigger-gate
          image: ghcr.io/omattsson/k8s-stack-manager-extensions/ci-trigger-gate:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: ci-trigger-gate-secret
            - configMapRef:
                name: ci-trigger-gate-config
          volumeMounts:
            - name: azure-identity-token
              mountPath: /var/run/secrets/azure/tokens
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: azure-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  path: azure-identity-token
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: ci-trigger-gate
  namespace: extensions
spec:
  selector:
    app: ci-trigger-gate
  ports:
    - port: 8080
      targetPort: 8080
