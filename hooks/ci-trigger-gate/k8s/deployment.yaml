apiVersion: v1
kind: Namespace
metadata:
  name: extensions
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-trigger-gate-secret
  namespace: extensions
type: Opaque
stringData:
  CI_TRIGGER_WEBHOOK_SECRET: "REPLACE_ME"
  ADO_PAT: "REPLACE_ME"
  REGISTRY_USERNAME: "REPLACE_ME"
  REGISTRY_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-trigger-gate-config
  namespace: extensions
data:
  ADO_ORG: "REPLACE_ME"
  ADO_PROJECT: "REPLACE_ME"
  REGISTRY_URL: "REPLACE_ME"
  IMAGE_REPO_PREFIX: "dev"
  POLL_INTERVAL_SECONDS: "15"
  CACHE_TTL_MINUTES: "5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-trigger-gate
  namespace: extensions
  labels:
    app: ci-trigger-gate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-trigger-gate
  template:
    metadata:
      labels:
        app: ci-trigger-gate
    spec:
      containers:
        - name: ci-trigger-gate
          image: ci-trigger-gate:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: ci-trigger-gate-secret
            - configMapRef:
                name: ci-trigger-gate-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ci-trigger-gate
  namespace: extensions
spec:
  selector:
    app: ci-trigger-gate
  ports:
    - port: 8080
      targetPort: 8080
